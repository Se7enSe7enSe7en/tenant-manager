services:
  postgres:
    image: postgres:18-alpine
    container_name: tenant-manager-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

# notes:
# 1) to run this compose file in prod "docker compose -f docker-compose.prod.yml up -d",
#   "-f" targets the file, since by default docker compose looks for "docker-compose.yml"
# 2) to do health check "docker inspect --format='{{.State.Health.Status}}' tenant-manager-postgres-db"

