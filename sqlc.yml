version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/**/*.query.sql"
    schema: "./internal/database/migrations"
    gen:
      go:
        package: "repo"
        out: "./internal/database/generated"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_pointers_for_null_types: true # for pointers as nil *time.Time
        overrides:
          # pgtype.UUID to google/uuid
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"
          # pgtype.Numeric to Decimal
          - db_type: "pg_catalog.numeric"
            nullable: false
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          # pgtype.Timestamp to time.Timestamp
          - db_type: "pg_catalog.timestamp"
            nullable: false
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "pg_catalog.timestampz"
            nullable: false
            go_type: "time.Time"
          - db_type: "pg_catalog.timestampz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
