# https://taskfile.dev

# Setup guide:
# STEP 1: install task, `go install github.com/go-task/task/v3/cmd/task@latest`
# STEP 2: use task to run the "setup" command `task setup`

# Setup tailwind without npm: https://tailwindcss.com/blog/standalone-cli

version: "3"

interval: 500ms # note: this is the watch interval, taskfile will watch for changes every 500ms

dotenv: [.env]

vars:
  APP_NAME: tenant-manager

  # dev vars
  FREE_PORT:
    sh: port=$PORT; while nc -z localhost $port >/dev/null 2>&1; do port=$((port+1)); done; echo $port
  PORT: "{{.PORT | default .FREE_PORT}}"
  # PORT: 8080
  # note: The app port: an explicit 'task dev PORT=8091' wins, otherwise the next
  # free port from 8090 up. The templ proxy and the app share the result,
  # so hot reload never points at a foreign app.

  PROXY_PORT: 7331
  TAILWIND_INPUT_CSS_PATH: ./internal/web/static/assets/css/input.css
  TAILWIND_OUTPUT_CSS_PATH: ./internal/web/static/assets/css/output.css
  SERVER_PATH: ./cmd/server
  BUILD_PATH: ./dist

  # prod vars
  REMOTE_USER: deploy
  REMOTE_HOST: $REMOTE_HOST # env variable
  REMOTE_PATH: /opt/tenant-manager
  BINARY: bin/tenant-manager

tasks:
  setup-watchman-linux:
    desc: Installs watchman on WSL/Linux if not already present
    platforms: [linux]
    status:
      - which watchman
    cmds:
      - echo "Watchman not found. Installing via apt..."
      - sudo apt update && sudo apt install -y watchman

  setup-watchman-mac:
    desc: Installs watchman on macOS via Homebrew if not already present
    platforms: [darwin]
    status:
      - which watchman
    cmds:
      - echo "Watchman not found. Installing via Homebrew..."
      - brew install watchman

  setup-watchman:
    # note: watchman is needed for tailwindcss cli tool (--watch flag) for checking if there are changes project files to rebuild the css output
    deps:
      - task: setup-watchman-linux
      - task: setup-watchman-mac

  setup-tailwind-cli-mac:
    platforms: [darwin]
    status:
      - test -f tailwindcss
    cmds:
      - curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-macos-arm64
      - chmod +x tailwindcss-macos-arm64
      - mv tailwindcss-macos-arm64 tailwindcss

  setup-tailwind-cli-linux:
    platforms: [linux]
    status:
      - test -f tailwindcss
    cmds:
      - curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.18/tailwindcss-linux-x64
      - chmod +x tailwindcss-linux-x64
      - mv tailwindcss-linux-x64 tailwindcss

  setup-tailwind:
    deps:
      - task: setup-tailwind-cli-mac
      - task: setup-tailwind-cli-linux

  setup:
    cmds:
      - go install github.com/a-h/templ/cmd/templ@latest # setup templ
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest # setup sqlc
      - go install github.com/pressly/goose/v3/cmd/goose@latest # setup goose
      - go install github.com/axadrn/shadcn-templ/v2/cmd/shadcn-templ@latest # setup shadcn-templ (previously known as templui)
      - task: setup-watchman
      - task: setup-tailwind
      - go mod tidy

  kill:
    method: none
    desc: Kills process on ports 8080 and 7331
    # note: sometimes the server survives a signal interrupt (ctrl + c) from the terminal, this command make sure it is killed
    cmds:
      # kills process on port 8080 on linux
      - cmd: fuser -k {{.PORT}}/tcp {{.PROXY_PORT}}/tcp > /dev/null 2>&1 || true
        platforms: [linux]

      # kills process on port 8080 on macOS (darwin)
      - cmd: (lsof -nti :{{.PORT}},:{{.PROXY_PORT}} | xargs kill -9) || true
        platforms: [darwin]

  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - go tool templ generate --watch --proxy="http://localhost:{{.PORT}}" --cmd="go run -tags=debug {{.SERVER_PATH}}/main.go" --open-browser=false
    env:
      PORT: "{{.PORT}}"

  templ-watch:
    method: none
    desc: Templ hot reload, watches all .go files
    watch: true
    sources:
      - "**/output.css"
      # - '**/*.go' # templ already watches all .go files
    cmds:
      # - templ generate --watch --proxy="http://localhost:{{.PORT}}" --open-browser=false --cmd="go run {{.SERVER_PATH}}"
      - templ generate --watch --proxy="http://localhost:{{.PORT}}" --open-browser=false --cmd="./scripts/run-dev.sh"
      # note #1: avoid using --cmd="go run {{.SERVER_PATH}}" since we encounter an issue with the go run cache, see docs/ai-generated/templ-zombie-process-fix.md
      # note #2: supposedly we simply want to run --cmd="go run build -o {{.BUILD_PATH}}/main-dev {{.SERVER_PATH}} && {{.BUILD_PATH}}/main-dev" here,
      # however it is currently not possible to run 2 commands as the argument for --cmd.
      # note #3: doing --cmd="task dev-server" causes a new problem where the task command doesn't restart properly
      # TODO: find a better way using `templ generate --notify-proxy`

  tailwind:
    desc: Tailwind watch css changes in .templ files
    cmds:
      - ./tailwindcss --input {{.TAILWIND_INPUT_CSS_PATH}} --output {{.TAILWIND_OUTPUT_CSS_PATH}}

  tailwind-watch:
    method: none
    desc: Tailwind watch css changes in .templ files
    watch: true
    sources:
      - "**/input.css"
      - "**/*.svg"
      # - '**/*.templ' # tailwind already watches all templ files, and is set in input.css
    cmds:
      - ./tailwindcss --input {{.TAILWIND_INPUT_CSS_PATH}} --output {{.TAILWIND_OUTPUT_CSS_PATH}} --watch

  scripts-watch:
    desc: Watch component scripts
    watch: true
    cmds:
      - go tool shadcn-templ bundle --watch

  db:
    desc: Start postgres db using docker and run it in the background
    cmds:
      - docker compose up --detach

  migrate-up:
    desc: Run migration scripts from the app
    deps: [build]
    cmds:
      - ./{{.BINARY}} migrate-up

  build:
    desc: build the app binary
    cmds:
      - go tool templ generate
      - ./tailwindcss --input {{.TAILWIND_INPUT_CSS_PATH}} --output {{.TAILWIND_OUTPUT_CSS_PATH}} --minify
      - go tool shadcn-templ bundle
      - go mod tidy
      - go build -o {{.BINARY}} {{.SERVER_PATH}}/main.go

  build-prod:
    desc: build the app binary for production, it will be on a linux VPS
    cmds:
      - go tool templ generate
      - ./tailwindcss --input {{.TAILWIND_INPUT_CSS_PATH}} --output {{.TAILWIND_OUTPUT_CSS_PATH}} --minify
      - go tool shadcn-templ bundle
      - go mod tidy
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o {{.BINARY}} {{.SERVER_PATH}}/main.go

  # dev:
  #   env:
  #     SHADCN_TEMPL_DEV: "true"
  #   desc: Start development server with hot reload
  #   cmds:
  #     - task --parallel tailwind-watch scripts-watch templ
  dev:
    method: none
    desc: watch for changes and start the project for development
    env:
      SHADCN_TEMPL_DEV: "true"
    deps: [db]
    cmds:
      - task --parallel scripts-watch tailwind-watch templ-watch

  deploy:
    desc: build the app binary, upload it using scp, migrate the app using the embedded migration scripts, restart the app service
    requires:
      vars:
        - REMOTE_HOST # this is an env var
    cmds:
      - task: build-prod
      - ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} "sudo systemctl stop {{.APP_NAME}}"
      - scp {{.BINARY}} {{.REMOTE_USER}}@{{.REMOTE_HOST}}:{{.REMOTE_PATH}}/
      - ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} "cd {{.REMOTE_PATH}} && ./{{.APP_NAME}} migrate-up"
      - ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} "sudo systemctl start {{.APP_NAME}}"
      - echo "Successfully Deployed wahoo!"

  setup-prod:
    desc: setup needed files in the production VPS, this only needs to run once
    requires:
      vars:
        - REMOTE_HOST
    cmds:
      - scp ./docker-compose.prod.yml {{.REMOTE_USER}}@{{.REMOTE_HOST}}:{{.REMOTE_PATH}}/
      - scp ./.env.prod.example {{.REMOTE_USER}}@{{.REMOTE_HOST}}:{{.REMOTE_PATH}}/

  default:
    - task: dev
